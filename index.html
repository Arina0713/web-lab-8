<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Кнопка, которая открывает попап -->
     <button id="openFormBtn" class="open-btn">Связаться с нами</button>
     <!-- Попап с формой (поверх страницы) -->
      <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button id="closeFormBtn" class="close-btn" type="button">✕</button>
            <form id="feedbackForm" novalidate>
                <h2>Обратная связь</h2>
                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="you@mail.ru">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="79001234567">
                <label for="org">Организация</label>
                <input type="text" id="org" name="org" placeholder="Название организации">
                <label for="message">Сообщение</label>
                <textarea id="message" name="message" rows="3" placeholder="Ваше сообщение"></textarea>
                <label class="checkbox-row">
                    <input type="checkbox" id="agree" name="agree">
                    <span>Согласен с политикой обработки персональных данных</span>
                </label>
                <p id="formStatus" class="form-status"></p>
                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
